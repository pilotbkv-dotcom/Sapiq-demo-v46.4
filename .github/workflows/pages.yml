name: Publish Sapiq v46.4 to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - site.zip
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract and verify supplied site
        shell: bash
        run: |
          set -euo pipefail
          test -s site.zip
          unzip -tq site.zip
          mkdir -p _site
          unzip -q site.zip -d _site
          for f in index.html ru/index.html en/index.html es/index.html zh/index.html ru/terminal/index.html terminal/index.html pwa/index.html site/assets/v46_terminal.js site/assets/v46.css site/assets/pnl-qr-site.png site/assets/pnl-trio-v464-ru.webp site/assets/pnl-trio-v464-en.webp site/assets/pnl-trio-v464-es.webp site/assets/pnl-trio-v464-zh.webp; do
            test -s "_site/$f" || { echo "Missing required file: $f"; exit 1; }
          done
          test -f _site/.nojekyll
          count="$(find _site -type f | wc -l)"
          echo "Verified $count site files"
          test "$count" -ge 250
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
